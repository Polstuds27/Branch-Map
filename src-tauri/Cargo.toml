[package]
name = "branchmap"
version = "0.1.0"
description = "A local-first desktop app that visually explains local Git repositories"
authors = ["BranchMap"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Consumed by `src-tauri/src/main.rs`; desktop binary keeps `staticlib`/`cdylib`
# so the same library can back a mobile target later.
name = "branchmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
# Local Ollama HTTP API. `json` is required; TLS uses the platform backend on
# Windows, so no OpenSSL toolchain is needed.
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time"] }
